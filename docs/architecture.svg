<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Lab architecture: attacker shell and Wazuh stack on the host, victim VM running sshd, nginx, auditd, Suricata and the Wazuh agent.">
  <rect width="960" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Host -->
  <rect x="40" y="42" width="360" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b1f33">HOST  ·  CachyOS</text>

  <rect x="60" y="86" width="320" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="76" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0b1f33">Attacker shell</text>
  <text x="76" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">nmap  ·  hydra  ·  curl  ·  ssh</text>
  <text x="76" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">controlled traffic, no external targets</text>

  <rect x="60" y="190" width="320" height="134" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="76" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0b1f33">Docker  ·  Wazuh 4.14.7</text>

  <rect x="76" y="224" width="288" height="24" rx="3" fill="#f1f5f9"/>
  <text x="86" y="241" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937">wazuh-manager</text>
  <text x="240" y="241" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">decode and match</text>

  <rect x="76" y="254" width="288" height="24" rx="3" fill="#f1f5f9"/>
  <text x="86" y="271" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937">wazuh-indexer</text>
  <text x="240" y="271" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">store events</text>

  <rect x="76" y="284" width="288" height="24" rx="3" fill="#f1f5f9"/>
  <text x="86" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f2937">wazuh-dashboard</text>
  <text x="240" y="301" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">analyst view</text>

  <!-- Victim -->
  <rect x="560" y="42" width="360" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="580" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b1f33">VICTIM VM  ·  Debian 12</text>

  <circle cx="588" cy="101" r="3" fill="#0f766e"/>
  <text x="600" y="105" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">sshd</text>
  <text x="700" y="105" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">authentication log</text>

  <circle cx="588" cy="129" r="3" fill="#0f766e"/>
  <text x="600" y="133" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">nginx and PHP</text>
  <text x="700" y="133" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">web access log</text>

  <circle cx="588" cy="157" r="3" fill="#0f766e"/>
  <text x="600" y="161" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">auditd</text>
  <text x="700" y="161" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">execve records</text>

  <circle cx="588" cy="185" r="3" fill="#0f766e"/>
  <text x="600" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">Suricata</text>
  <text x="700" y="189" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">alert, http, dns</text>

  <circle cx="588" cy="213" r="3" fill="#0f766e"/>
  <text x="600" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937">wazuh-agent</text>
  <text x="700" y="217" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">forwarder</text>

  <rect x="580" y="244" width="320" height="78" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="594" y="266" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">file integrity monitoring</text>
  <text x="594" y="286" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">/etc  ·  /home  ·  /var/www/html</text>
  <text x="594" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">realtime syscheck events</text>

  <!-- Links -->
  <line x1="470" y1="130" x2="536" y2="130" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="503" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0b1f33">attacks</text>
  <text x="503" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">10.0.2.2 to 10.0.2.15</text>

  <line x1="536" y1="300" x2="470" y2="300" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="503" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0b1f33">events</text>
  <text x="503" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">manager port 1514</text>

  <text x="40" y="376" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">QEMU user networking. The guest sees the host as 10.0.2.2. Ports 2222 and 8080 are forwarded to 127.0.0.1 on the host.</text>
  <text x="40" y="398" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">No bridge, no tap, no route to the local network. Suricata runs inside the VM on 8,200 ET Open rules.</text>
</svg>
